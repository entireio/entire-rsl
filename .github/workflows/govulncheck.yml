name: govulncheck
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily, so a newly published advisory surfaces without a code change.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: govulncheck
        run: mise run vuln
