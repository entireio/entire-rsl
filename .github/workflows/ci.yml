name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Least privilege: every job here only reads the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      # -race needs cgo, which the Windows runner lacks, so only Linux runs it.
      - name: Tests (race)
        if: runner.os == 'Linux'
        run: mise run test:ci
      - name: Tests
        if: runner.os != 'Linux'
        shell: bash
        run: go test ./...

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Build and vet
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags '-s -w' ./...
          go vet ./...
          go test -c -o /dev/null ./cmd/entire-rsl/cli
