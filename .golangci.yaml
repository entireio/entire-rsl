version: "2"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - decorder
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - gosec
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - reassign
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    goconst:
      ignore-tests: true
      ignore-map-keys: true
    gosec:
      excludes:
        - G204 # subprocess with variables is expected for the git CLI wrapper, which passes a resolved absolute path and an argument slice
    errcheck:
      check-type-assertions: true
      check-blank: true
    wrapcheck:
      # The repository's own packages already return errors with context.
      # Wrapping them again at every call site only repeats it.
      ignore-package-globs:
        - github.com/entireio/entire-rsl/internal/*
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.Getwd$'
          msg: "resolve the repository through internal/repo, which prefers ENTIRE_REPO_ROOT"
          pkg: '^os$'
        - pattern: '^.*\.(Print|Println|Printf)$'
          msg: "cobra's Print* writes to OutOrStderr (stderr in production); use fmt.Fprint*(cmd.OutOrStdout(), ...)"
          pkg: 'github\.com/spf13/cobra'
        - pattern: '^os\.(Stdout|Stderr)$'
          msg: "write user output through cmd.OutOrStdout() and cmd.ErrOrStderr()"
          pkg: '^os$'
        - pattern: '^exec\.Command$'
          msg: "run git through internal/gitcli, which resolves git once and strips repo selectors"
          pkg: '^os/exec$'
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: true
    testifylint:
      enable-all: true
    unparam:
      check-exported: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          - forbidigo
      - path: ^cmd/entire-rsl/main\.go$
        text: "os\\.(Stdout|Stderr)"
        linters:
          - forbidigo
